name: Verify RTE pipeline
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python src/01_extract_rte.py
      - run: python src/02_build_silver.py
      - run: python src/03_build_gold.py
      - run: python src/04_validate_independent.py
      - run: python -m pytest -q
      - run: python src/06_forecast.py evaluate
      - run: python src/06_forecast.py predict --region Bretagne --date 2025-06-15
